interface:
  display_name: "vsum"
  short_description: "Turn one public video URL into verified local transcript artifacts."
  default_prompt: "Use vsum to probe this video URL, prefer available subtitles, and generate transcript.txt plus transcript-readable.md when possible."

compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths:
      - "./skill"
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
